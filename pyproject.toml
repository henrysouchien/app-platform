[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-platform"
version = "0.9.1"
description = "Generic web app infrastructure: PostgreSQL pooling, structured logging, rate limiting, FastAPI middleware, auth service, gateway proxy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Henry Chien" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "psycopg2-binary>=2.9.13,<3",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.135.3,<1",
    "starlette>=1.6.0,<2",
    "slowapi>=0.1.9,<1",
    "itsdangerous>=2.0,<3",
]
auth-google = [
    "google-auth>=2.0,<3",
    "requests>=2.33.1,<3",
]
gateway = [
    "httpx>=0.28.1,<1",
    "fastapi>=0.135.3,<1",
    "pydantic>=2.12.5,<3",
    "pydantic-core>=2.41.5,<3",
    "PyJWT>=2.14.0,<3",
    "cryptography>=50.0.1,<51",
]
all = ["app-platform[fastapi,auth-google,gateway]"]

[project.urls]
Homepage = "https://github.com/henrysouchien/app-platform"
Repository = "https://github.com/henrysouchien/app-platform"

# The published surface of app-platform.
# This table is the ONLY declaration of what ships. scripts/sync_app_platform.sh
# and the hatchling build both derive the file set from it; README.md documents
# the same surface by hand and is held to this table by
# tests/app_platform/test_distribution_contract.py.
# It sits under [tool.hatch.build] rather than a per-target table so it governs
# every artifact hatchling emits -- publish uploads the sdist as well as the
# wheel, and a table scoped to one target would leave the other undeclared.
# Paths are relative to the distribution root, i.e. the dist repo root, where
# scripts/sync_app_platform.sh copies this file.
# Membership is directory-granular: a new top-level member requires an edit
# here, while a new file inside a declared directory ships automatically. What
# such a file may import -- from this repository or from a distribution that
# [project] does not declare -- is governed by
# tests/test_architecture_boundaries.py.
[tool.hatch.build]
only-include = [
    "app_platform/__init__.py",
    "app_platform/py.typed",
    "app_platform/auth",
    "app_platform/db",
    "app_platform/gateway",
    "app_platform/logging",
    "app_platform/middleware",
]
